baseURL = "https://kemalbiyikli.com/"
languageCode = "tr-TR"
defaultContentLanguage = "tr"
title = "Kemal Bıyıklı"
timeZone = "Europe/Istanbul"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
capitalizeListTitles = false

[pagination]
  pagerSize = 10

[permalinks.page]
  posts = "/:slug/"

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.extras.insert]
  enable = true
[markup.goldmark.extensions.extras.mark]
  enable = true
[markup.goldmark.extensions.extras.superscript]
  enable = true
[markup.highlight]
  style = "monokai"
  lineNos = false

[params]
  env = "production"
  author = "Kemal Bıyıklı"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = true
  ShareButtons = ["linkedin", "x", "whatsapp", "telegram"]
  displayFullLangName = true
  [params.fuseOpts]
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  name = "Arşiv"
  pageRef = "/archives"
  weight = 10
[[menu.main]]
  name = "Konular"
  pageRef = "/tags"
  weight = 30
[[menu.main]]
  name = "Ara"
  pageRef = "/search"
  weight = 40
[[menu.main]]
  name = "Hakkımda"
  pageRef = "/hakkimizda"
  weight = 50
