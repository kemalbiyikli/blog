name: Konulari duzenle (tek seferlik)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/retag.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Kategoriler kaldirildi, konular duzenlendi" || echo "degisiklik yok"
          git push
      - run: gh workflow run hugo.yml
        env:
          GH_TOKEN: ${{ github.token }}
