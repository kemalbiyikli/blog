name: WordPress aktarimi (tek seferlik)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q pandoc
      - run: python3 scripts/wp_import.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "WordPress yazilari aktarildi" || echo "degisiklik yok"
          git push
      - run: gh workflow run hugo.yml
        env:
          GH_TOKEN: ${{ github.token }}
