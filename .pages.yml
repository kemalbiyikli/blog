media:
  input: static/images
  output: /images
content:
  - name: posts
    label: Yazılar
    type: collection
    path: content/posts
    filename: "{fields.slug}.md"
    view:
      fields: [title, date, draft]
      sort: [date]
    fields:
      - { name: title, label: Başlık, type: string, required: true }
      - { name: date, label: Tarih, type: date, options: { time: true, format: "yyyy-MM-dd'T'HH:mm:ss" } }
      - { name: draft, label: Taslak (yayınlanmasın), type: boolean, default: false }
      - name: tags
        label: Konular
        type: select
        options:
          multiple: true
          creatable: true
          values: [VMware, vCenter, ESXi, Storage, HPE MSA, iSCSI, Linux, Ubuntu, LVM, Redis, Guacamole, Veeam, Hyper-V, Migration, Dell EMC, Data Domain, Backup, Zabbix, Monitoring, Upgrade, CLI, Sorun Giderme]
      - { name: slug, label: "Kısa ad (URL ve dosya adı, örn: esxi-iscsi-mount)", type: string, required: true }
      - { name: body, label: İçerik, type: rich-text }
  - name: pages
    label: Sayfalar
    type: collection
    path: content
    filename: "{primary}.md"
    fields:
      - { name: title, label: Başlık, type: string }
      - { name: url, label: URL, type: string }
      - { name: body, label: İçerik, type: rich-text }
